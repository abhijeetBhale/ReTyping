# Render blueprint for FingerFiasco (Next.js App Router).
# Dashboard: New → Blueprint → select this repo. Render reads this file
# and creates the web service below. `npm run start` (next start)
# automatically listens on Render's injected PORT.
services:
  - type: web
    name: fingerfiasco-next
    runtime: node
    plan: free
    # NOTE: never set NODE_ENV=production here — npm then skips devDependencies
    # and the Tailwind/PostCSS build breaks. Next runs production mode on its own.
    # --include=dev makes the build robust even if the environment disagrees.
    buildCommand: npm install --include=dev; npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # TODO(sync): after the first deploy, replace with the real
      # https://<service>.onrender.com URL (Dashboard → service → URL),
      # then trigger a manual redeploy — metadata is baked at build time.
      # Or set a custom domain and use that instead.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://fingerfiasco-next.onrender.com
      # Supabase Auth + history (public anon key only — never service_role).
      # Get values from Supabase Dashboard → Project Settings → API.
      # Changing these requires a manual redeploy (baked at build time).
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
